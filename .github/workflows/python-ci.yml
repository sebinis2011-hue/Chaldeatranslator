name: Python quality checks

on:
  push:
    branches:
      - main
      - "cloud/**"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "cloud/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install coverage

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify Python syntax
        run: python -m compileall -q api core tests

      - name: Verify Termux shell script syntax
        run: |
          bash -n chaldea-translator.sh
          bash -n scripts/termux-setup.sh
          bash -n scripts/termux-local.sh

      - name: Run unit tests with branch coverage
        run: |
          coverage run --branch -m unittest discover -s tests -v
          coverage report -m
          coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaldea-coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
